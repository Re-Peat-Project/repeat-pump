[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repeat-pump"
version = "0.3.0"
description = "RE-PEAT: rewetting with pompanisasi (canal prioritisation, sekat placement, pump routing)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "scipy", "rasterio", "geopandas", "shapely>=2", "pyogrio",
  "networkx", "whitebox", "pydantic>=2", "pyyaml",
  # groundwater solver and peat tables of the block optimisation; a GitHub archive (no git needed). Developers: README section 1
  "repeat-neraca @ https://github.com/Re-Peat-Project/repeat-neraca/archive/refs/tags/v0.2.0.zip",
]

[project.optional-dependencies]
dev = ["pytest"]
ee = ["earthengine-api"]    # only for `repeat-pump fetch-moisture --source ee` (exact CPWI v2)

[project.scripts]
repeat-pump = "repeat_pump.cli:main"

[tool.setuptools.packages.find]
include = ["repeat_pump*"]

[tool.setuptools.package-data]
"repeat_pump.data" = ["*.csv", "*.md", "report_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
