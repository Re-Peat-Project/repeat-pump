<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Plus Jakarta Sans, Poppins, Segoe UI, Calibri, Arial, sans-serif" role="img" aria-label="Analisis medan, penempatan sekat, dan skoring"><defs><marker id="m12406b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12406b"/></marker><marker id="mf26522" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f26522"/></marker><marker id="m08a67a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#08a67a"/></marker><marker id="m2979f2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2979f2"/></marker><marker id="md9363e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9363e"/></marker><marker id="m5f7389" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f7389"/></marker><marker id="m9aa6a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa6a0"/></marker><marker id="mf7941d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f7941d"/></marker><linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2979f2"/><stop offset="1" stop-color="#153e6a"/></linearGradient><linearGradient id="gChip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08a67a"/><stop offset="1" stop-color="#2279ee"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb300"/><stop offset="1" stop-color="#f26522"/></linearGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#ffffff"/><text x="50" y="84" font-size="52" font-weight="800" fill="#12406b">Analisis medan, penempatan sekat, <tspan fill="#f26522">dan skoring</tspan></text><rect x="50" y="125" width="640" height="340" rx="22" fill="#f3f6fb" stroke="#dce5f1" stroke-width="2"/><path d="M50 171V147a22 22 0 0 1 22 -22H668a22 22 0 0 1 22 22V171Z" fill="url(#gBlue)"/><text x="72" y="156.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">A. Profil lahan: tinggi DI TEPI kanal</text><polygon points="90,330 300,330 325,400 415,400 440,330 650,330 650,445 90,445" fill="#dbe9fb" opacity="0.8"/><polyline points="90,330 300,330 325,400 415,400 440,330 650,330" fill="none" stroke="#12406b" stroke-width="3" stroke-linejoin="round"/><rect x="326" y="368" width="88" height="32" rx="4" fill="#ffffff" stroke="#2979f2" stroke-width="1.5"/><text x="370" y="390" font-size="14" font-weight="600" fill="#2979f2" text-anchor="middle">air / parit</text><circle cx="245.0" cy="330" r="7" fill="#f26522" stroke="#fff" stroke-width="2"/><line x1="245.0" y1="322" x2="245.0" y2="290" stroke="#f26522" stroke-width="1.5" stroke-dasharray="4 3"/><text x="245.0" y="284" font-size="15" font-weight="800" fill="#f26522" text-anchor="middle">−10</text><circle cx="295.0" cy="330" r="7" fill="#f26522" stroke="#fff" stroke-width="2"/><line x1="295.0" y1="322" x2="295.0" y2="290" stroke="#f26522" stroke-width="1.5" stroke-dasharray="4 3"/><text x="295.0" y="284" font-size="15" font-weight="800" fill="#f26522" text-anchor="middle">−6</text><circle cx="445.0" cy="330" r="7" fill="#f26522" stroke="#fff" stroke-width="2"/><line x1="445.0" y1="322" x2="445.0" y2="290" stroke="#f26522" stroke-width="1.5" stroke-dasharray="4 3"/><text x="445.0" y="284" font-size="15" font-weight="800" fill="#f26522" text-anchor="middle">+6</text><circle cx="495.0" cy="330" r="7" fill="#f26522" stroke="#fff" stroke-width="2"/><line x1="495.0" y1="322" x2="495.0" y2="290" stroke="#f26522" stroke-width="1.5" stroke-dasharray="4 3"/><text x="495.0" y="284" font-size="15" font-weight="800" fill="#f26522" text-anchor="middle">+10</text><line x1="160" y1="230" x2="580" y2="230" stroke="#08a67a" stroke-width="2" stroke-dasharray="9 5"/><text x="370.0" y="222" font-size="16" font-weight="700" fill="#12406b" text-anchor="middle">z_lahan = median keempat titik (offset dalam m)</text><text x="72" y="423" font-size="15.5" font-weight="500" fill="#5f7389" text-anchor="start">Dasar kanal lebih rendah dari lahan, jadi titik tengah tidak dipakai.</text><text x="72" y="445" font-size="15.5" font-weight="500" fill="#5f7389" text-anchor="start">Lalu median filter 50 m sepanjang kanal; kemiringan = gradien.</text><rect x="50" y="490" width="640" height="500" rx="22" fill="#f3f6fb" stroke="#dce5f1" stroke-width="2"/><path d="M50 536V512a22 22 0 0 1 22 -22H668a22 22 0 0 1 22 22V536Z" fill="url(#gBlue)"/><text x="72" y="521.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">C. Skor kebutuhan per segmen</text><rect x="68" y="552" width="270" height="44" rx="14" fill="url(#gChip)"/><text x="82" y="572" font-size="16.5" font-weight="800" fill="#fff" text-anchor="start">Frekuensi terbakar</text><text x="82" y="589" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.9">kelas terpanjang</text><rect x="68" y="604" width="270" height="44" rx="14" fill="url(#gChip)"/><text x="82" y="624" font-size="16.5" font-weight="800" fill="#fff" text-anchor="start">Kedalaman gambut</text><text x="82" y="641" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.9">titik tengah kelas</text><rect x="68" y="656" width="270" height="44" rx="14" fill="url(#gChip)"/><text x="82" y="676" font-size="16.5" font-weight="800" fill="#fff" text-anchor="start">Kekeringan</text><text x="82" y="693" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.9">rata-rata cincin 15–100 m</text><rect x="68" y="708" width="270" height="44" rx="14" fill="url(#gChip)"/><text x="82" y="728" font-size="16.5" font-weight="800" fill="#fff" text-anchor="start">Kontribusi hulu</text><text x="82" y="745" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.9">log(maks flow acc)</text><polyline points="340,574 370,574 370,730 340,730" fill="none" stroke="#f7941d" stroke-width="3" stroke-linejoin="round"/><polygon points="378.0,632.0 387.0,632.0 396.0,652.0 387.0,672.0 378.0,672.0 387.0,652.0" fill="#f7941d"/><rect x="412" y="548" width="258" height="50" rx="14" fill="#ffffff" stroke="#2979f2" stroke-width="2"/><text x="424" y="570" font-size="16.5" font-weight="800" fill="#12406b" text-anchor="start">Normalisasi min–max</text><text x="424" y="588" font-size="13.5" font-weight="500" fill="#5f7389" text-anchor="start">0–1, arah &quot;lebih tinggi = lebih buruk&quot;</text><line x1="541" y1="598" x2="541" y2="608" stroke="#f7941d" stroke-width="3" marker-end="url(#mf7941d)"/><rect x="412" y="608" width="258" height="50" rx="14" fill="#ffffff" stroke="#2979f2" stroke-width="2"/><text x="424" y="630" font-size="16.5" font-weight="800" fill="#12406b" text-anchor="start">Bobot</text><text x="424" y="648" font-size="13.5" font-weight="500" fill="#5f7389" text-anchor="start">langsung / AHP (CR ≤ 0,10) / KLH</text><line x1="541" y1="658" x2="541" y2="668" stroke="#f7941d" stroke-width="3" marker-end="url(#mf7941d)"/><rect x="412" y="668" width="258" height="50" rx="14" fill="#ffffff" stroke="#2979f2" stroke-width="2"/><text x="424" y="690" font-size="16.5" font-weight="800" fill="#12406b" text-anchor="start">Skor = Σ bobot × nilai</text><text x="424" y="708" font-size="13.5" font-weight="500" fill="#5f7389" text-anchor="start">segmen status_mcda = 1 saja</text><line x1="541" y1="718" x2="541" y2="728" stroke="#f7941d" stroke-width="3" marker-end="url(#mf7941d)"/><rect x="412" y="728" width="258" height="50" rx="14" fill="#ffffff" stroke="#2979f2" stroke-width="2"/><text x="424" y="750" font-size="16.5" font-weight="800" fill="#12406b" text-anchor="start">Peringkat → pilih top 20%</text><text x="424" y="768" font-size="13.5" font-weight="500" fill="#5f7389" text-anchor="start">mode KLH: skor ≥ ambang (dari 12)</text><rect x="68" y="806" width="604" height="56" rx="14" fill="#ffffff" stroke="#f26522" stroke-width="2" stroke-dasharray="6 4"/><text x="82" y="830" font-size="15.5" font-weight="500" fill="#16324f" text-anchor="start">Konsesi: filter kelayakan SETELAH skor (exclude / flag / ignore),</text><text x="82" y="850" font-size="15.5" font-weight="500" fill="#16324f" text-anchor="start">tidak pernah masuk ke dalam skor kebutuhan.</text><rect x="68" y="872" width="604" height="56" rx="14" fill="#e6f0fa" stroke="#2979f2" stroke-width="2"/><text x="82" y="896" font-size="15.5" font-weight="500" fill="#16324f" text-anchor="start">Sensitivitas: bobot diubah ±10% dan ±20% satu per satu;</text><text x="82" y="916" font-size="15.5" font-weight="500" fill="#16324f" text-anchor="start">dilaporkan korelasi Spearman dan porsi top yang bertahan.</text><text x="72" y="954" font-size="15.5" font-weight="800" fill="#12406b" text-anchor="start">Hasil: need_score, need_rank, selected, qa_sensitivity</text><text x="72" y="974" font-size="15" font-weight="500" fill="#5f7389" text-anchor="start">Segmen di luar sub-KHG terpilih tidak diberi skor.</text><rect x="730" y="125" width="1140" height="865" rx="22" fill="#f3f6fb" stroke="#dce5f1" stroke-width="2"/><path d="M730 171V147a22 22 0 0 1 22 -22H1848a22 22 0 0 1 22 22V171Z" fill="url(#gBlue)"/><text x="752" y="156.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">B. Penempatan sekat: lahan naik sebesar dA dari sekat sebelumnya</text><text x="752" y="197" font-size="16" font-weight="500" fill="#5f7389" text-anchor="start">Contoh: lereng 1 m/km, dA = 0,40 m (PP 57/2016); dihitung dari hilir (sungai) ke hulu</text><line x1="820" y1="640" x2="1819.0" y2="640" stroke="#5f7389" stroke-width="2" marker-end="url(#m5f7389)"/><line x1="800" y1="630" x2="800" y2="259.24999999999994" stroke="#5f7389" stroke-width="2" marker-end="url(#m5f7389)"/><text x="1819.0" y="670" font-size="15" font-weight="500" fill="#5f7389" text-anchor="end">jarak dari hilir (m)</text><text x="790" y="249.24999999999994" font-size="15" font-weight="500" fill="#5f7389" text-anchor="start">tinggi lahan z (m)</text><line x1="820.0" y1="640" x2="820.0" y2="648" stroke="#5f7389" stroke-width="2"/><text x="820.0" y="666" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">0</text><line x1="1090.0" y1="640" x2="1090.0" y2="648" stroke="#5f7389" stroke-width="2"/><text x="1090.0" y="666" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">500</text><line x1="1360.0" y1="640" x2="1360.0" y2="648" stroke="#5f7389" stroke-width="2"/><text x="1360.0" y="666" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">1000</text><line x1="1630.0" y1="640" x2="1630.0" y2="648" stroke="#5f7389" stroke-width="2"/><text x="1630.0" y="666" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">1500</text><line x1="794" y1="620.0" x2="800" y2="620.0" stroke="#5f7389" stroke-width="2"/><text x="788" y="625.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">2,0</text><line x1="794" y1="546.0" x2="800" y2="546.0" stroke="#5f7389" stroke-width="2"/><text x="788" y="551.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">2,4</text><line x1="794" y1="472.0" x2="800" y2="472.0" stroke="#5f7389" stroke-width="2"/><text x="788" y="477.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">2,8</text><line x1="794" y1="398.0" x2="800" y2="398.0" stroke="#5f7389" stroke-width="2"/><text x="788" y="403.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">3,2</text><line x1="794" y1="324.0" x2="800" y2="324.0" stroke="#5f7389" stroke-width="2"/><text x="788" y="329.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">3,6</text><polyline points="820.0,621.48 874.0,600.02 928.0,584.48 982.0,563.02 1036.0,547.48 1090.0,526.02 1144.0,510.48 1198.0,489.02 1252.0,473.48 1306.0,452.02 1360.0,436.48 1414.0,415.02 1468.0,399.47999999999996 1522.0,378.02000000000004 1576.0,362.47999999999996 1630.0,341.02 1684.0,325.47999999999996 1738.0,304.02 1792.0,288.48" fill="none" stroke="#12406b" stroke-width="3.5" stroke-linejoin="round"/><text x="820" y="690" font-size="16" font-weight="800" fill="#2979f2" text-anchor="start">hilir (sungai)</text><text x="1792.0" y="265.00000000000006" font-size="16" font-weight="800" fill="#5f7389" text-anchor="end">hulu</text><line x1="820.0" y1="620.0" x2="982.0" y2="620.0" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="982.0" y1="620.0" x2="982.0" y2="564.5" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="982.0" y1="564.5" x2="1198.0" y2="564.5" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="1198.0" y1="564.5" x2="1198.0" y2="490.5" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="1198.0" y1="490.5" x2="1360.0" y2="490.5" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="1360.0" y1="490.5" x2="1360.0" y2="435.0" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="1360.0" y1="435.0" x2="1576.0" y2="435.0" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="1576.0" y1="435.0" x2="1576.0" y2="361.0" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="974.0" y="518.5" width="16" height="46" rx="3" fill="#9aa6a0" stroke="#12406b" stroke-width="1.5"/><text x="982.0" y="508.5" font-size="15" font-weight="800" fill="#5f7389" text-anchor="middle">E1 (tanpa pintu)</text><rect x="1190.0" y="444.5" width="16" height="46" rx="3" fill="#08a67a" stroke="#12406b" stroke-width="1.5"/><text x="1198.0" y="434.5" font-size="15" font-weight="800" fill="#12406b" text-anchor="middle">P1</text><rect x="1352.0" y="389.0" width="16" height="46" rx="3" fill="#9aa6a0" stroke="#12406b" stroke-width="1.5"/><text x="1360.0" y="379.0" font-size="15" font-weight="800" fill="#5f7389" text-anchor="middle">E2 (berpintu)</text><rect x="1568.0" y="315.0" width="16" height="46" rx="3" fill="#08a67a" stroke="#12406b" stroke-width="1.5"/><text x="1576.0" y="305.0" font-size="15" font-weight="800" fill="#12406b" text-anchor="middle">P2</text><line x1="1198.0" y1="564.5" x2="1246.6" y2="564.5" stroke="#f26522" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="1198.0" y1="490.5" x2="1246.6" y2="490.5" stroke="#f26522" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="1241.2" y1="564.5" x2="1241.2" y2="490.5" stroke="#f26522" stroke-width="2.5" marker-end="url(#mf26522)"/><text x="1251.2" y="532.5" font-size="16" font-weight="800" fill="#f26522" text-anchor="start">dA = 0,40 m</text><text x="988.0" y="598.5" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">baseline di-reset</text><text x="988.0" y="614.5" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">oleh sekat eksisting</text><text x="1366.0" y="469.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">reset lagi</text><rect x="1110" y="217" width="18" height="24" rx="3" fill="#9aa6a0" stroke="#12406b" stroke-width="1.5"/><text x="1138" y="236" font-size="15" font-weight="500" fill="#16324f" text-anchor="start">sekat eksisting (snap ke kanal)</text><rect x="1110" y="249" width="18" height="24" rx="3" fill="#08a67a" stroke="#12406b" stroke-width="1.5"/><text x="1138" y="268" font-size="15" font-weight="500" fill="#16324f" text-anchor="start">sekat usulan</text><line x1="1110" y1="291" x2="1128" y2="291" stroke="#08a67a" stroke-width="1.8" stroke-dasharray="6 4"/><text x="1138" y="297" font-size="15" font-weight="500" fill="#16324f" text-anchor="start">garis penelusuran dA</text><rect x="750.0" y="703" width="264.5" height="104" rx="16" fill="url(#gChip)"/><text x="764.0" y="731" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Jarak butuh</text><text x="764.0" y="761" font-size="15" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">js = dA / i_lahan</text><text x="764.0" y="789" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">dibatasi max_spacing_m</text><rect x="1028.5" y="703" width="264.5" height="104" rx="16" fill="url(#gChip)"/><text x="1042.5" y="731" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Jumlah butuh</text><text x="1042.5" y="761" font-size="15" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">n = ceil(Δz / dA)</text><text x="1042.5" y="789" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">Δz = z_hulu − z_hilir, per kanal</text><rect x="1307.0" y="703" width="264.5" height="104" rx="16" fill="url(#gChip)"/><text x="1321.0" y="731" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Kecukupan</text><text x="1321.0" y="761" font-size="15" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">IPG = n_eksisting / n_butuh</text><text x="1321.0" y="789" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">&gt; 1 berarti memadai</text><rect x="1585.5" y="703" width="264.5" height="104" rx="16" fill="url(#gChip)"/><text x="1599.5" y="731" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Tinggi sekat</text><text x="1599.5" y="761" font-size="15" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">ts = dk + js·tanα − dA</text><text x="1599.5" y="789" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">dk = kedalaman kanal</text><circle cx="760" cy="832" r="4" fill="#f26522"/><text x="774" y="837" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">Sekat usulan tidak dalam min_spacing_m dari sekat eksisting; duplikat dibuang.</text><circle cx="760" cy="858" r="4" fill="#f26522"/><text x="774" y="863" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">Sunting manual (tambah / hapus), lalu jarak dan tinggi dihitung ulang.</text><circle cx="760" cy="884" r="4" fill="#f26522"/><text x="774" y="889" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">Tipe: leaky / reinforced bila lereng ≥ 5%, selain itu standar.</text><circle cx="760" cy="910" r="4" fill="#f26522"/><text x="774" y="915" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">Profil memakai DTM asli; DTM hasil burning tidak pernah dipakai di sini.</text><rect x="750" y="941" width="1100" height="34" rx="17" fill="url(#gOrange)"/><text x="766" y="964" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Keluaran: sekat_proposed (jarak, tinggi, tipe), sekat_existing_assessed, IPG per kanal</text><rect x="50" y="1010" width="1820" height="50" rx="25" fill="url(#gBlue)"/><text x="960" y="1042" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Tinggi dan kemiringan selalu dari DTM asli; DTM hasil burning hanya dipakai untuk arah aliran.</text><text x="1870" y="1076" font-size="14" font-weight="400" fill="#5f7389" text-anchor="end">RE-PEAT  ·  KLH  ·  Departemen Teknik Geodesi UGM</text></svg>