<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Plus Jakarta Sans, Poppins, Segoe UI, Calibri, Arial, sans-serif" role="img" aria-label="Routing air dan pompanisasi"><defs><marker id="m12406b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12406b"/></marker><marker id="mf26522" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f26522"/></marker><marker id="m08a67a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#08a67a"/></marker><marker id="m2979f2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2979f2"/></marker><marker id="md9363e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9363e"/></marker><marker id="m5f7389" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f7389"/></marker><marker id="m9aa6a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa6a0"/></marker><marker id="mf7941d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f7941d"/></marker><linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2979f2"/><stop offset="1" stop-color="#153e6a"/></linearGradient><linearGradient id="gChip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08a67a"/><stop offset="1" stop-color="#2279ee"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb300"/><stop offset="1" stop-color="#f26522"/></linearGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#ffffff"/><text x="50" y="84" font-size="52" font-weight="800" fill="#12406b">Routing air dan <tspan fill="#f26522">pompanisasi</tspan></text><rect x="50" y="125" width="1000" height="865" rx="22" fill="#f3f6fb" stroke="#dce5f1" stroke-width="2"/><path d="M50 171V147a22 22 0 0 1 22 -22H1028a22 22 0 0 1 22 22V171Z" fill="url(#gBlue)"/><text x="72" y="156.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">A. Routing: dari sungai ke titik tertinggi, dengan biaya berbasis tinggi</text><text x="72" y="201" font-size="16" font-weight="700" fill="#12406b" text-anchor="start" font-family="Consolas, Menlo, monospace">Graf berarah; biaya(u→v) = panjang + λ · max(0, z_ke − z_dari)</text><rect x="80" y="455" width="40" height="340" rx="14" fill="#dbe9fb" stroke="#2979f2" stroke-width="2"/><text transform="rotate(-90 100 635)" x="100" y="635" font-size="17" font-weight="800" fill="#2979f2" text-anchor="middle">Sungai</text><line x1="160" y1="665" x2="350" y2="777" stroke="#9aa6a0" stroke-width="3"/><line x1="350" y1="777" x2="690" y2="777" stroke="#9aa6a0" stroke-width="3"/><line x1="690" y1="777" x2="730" y2="505" stroke="#9aa6a0" stroke-width="3"/><text x="277.0" y="715.0" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">datar tapi panjang</text><line x1="530" y1="585" x2="530" y2="395" stroke="#9aa6a0" stroke-width="3" stroke-dasharray="8 6"/><line x1="530" y1="395" x2="910" y2="395" stroke="#9aa6a0" stroke-width="3" stroke-dasharray="8 6"/><rect x="516.0" y="476.0" width="28" height="28" rx="4" fill="#fff" stroke="#d9363e" stroke-width="3"/><line x1="521.0" y1="481.0" x2="539.0" y2="499.0" stroke="#d9363e" stroke-width="3"/><line x1="521.0" y1="499.0" x2="539.0" y2="481.0" stroke="#d9363e" stroke-width="3"/><text x="506.0" y="486.0" font-size="15" font-weight="800" fill="#d9363e" text-anchor="end">sekat eksisting TANPA pintu</text><text x="506.0" y="504.0" font-size="14" font-weight="500" fill="#d9363e" text-anchor="end">= penghalang, aliran tidak lewat</text><line x1="160" y1="665" x2="350" y2="665" stroke="#08a67a" stroke-width="7"/><line x1="350" y1="665" x2="530" y2="585" stroke="#08a67a" stroke-width="7"/><line x1="530" y1="585" x2="730" y2="505" stroke="#08a67a" stroke-width="7"/><line x1="730" y1="505" x2="910" y2="395" stroke="#08a67a" stroke-width="7"/><line x1="730" y1="505" x2="910" y2="595" stroke="#08a67a" stroke-width="7"/><rect x="429.0" y="614.0" width="22" height="22" rx="3" fill="#d7f2ea" stroke="#12406b" stroke-width="2.5"/><text x="456.0" y="665.0" font-size="14" font-weight="600" fill="#12406b" text-anchor="start">sekat usulan: tidak menghalang,</text><text x="456.0" y="681.0" font-size="14" font-weight="600" fill="#12406b" text-anchor="start">masuk daftar pintu (gates_required)</text><circle cx="160" cy="665" r="22" fill="#2979f2" stroke="#fff" stroke-width="3"/><text x="160" y="671" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">S</text><text x="160" y="637" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">z = 2,0</text><circle cx="350" cy="665" r="17" fill="#fff" stroke="#12406b" stroke-width="3"/><text x="350" y="670" font-size="14" font-weight="800" fill="#16324f" text-anchor="middle">A</text><text x="350" y="637" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">z = 2,3</text><circle cx="530" cy="585" r="17" fill="#fff" stroke="#12406b" stroke-width="3"/><text x="530" y="590" font-size="14" font-weight="800" fill="#16324f" text-anchor="middle">B</text><text x="560" y="609" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">z = 2,7</text><circle cx="730" cy="505" r="17" fill="#fff" stroke="#12406b" stroke-width="3"/><text x="730" y="510" font-size="14" font-weight="800" fill="#16324f" text-anchor="middle">C</text><text x="730" y="477" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">z = 3,1</text><circle cx="910" cy="395" r="24" fill="#f26522" stroke="#fff" stroke-width="3"/><text x="910" y="401" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">T1</text><text x="942" y="401" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">z = 3,5</text><circle cx="910" cy="595" r="24" fill="#f26522" stroke="#fff" stroke-width="3"/><text x="910" y="601" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">T2</text><text x="942" y="601" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">z = 3,4</text><circle cx="530" cy="395" r="17" fill="#fff" stroke="#9aa6a0" stroke-width="3"/><text x="530" y="400" font-size="14" font-weight="800" fill="#16324f" text-anchor="middle">D</text><text x="530" y="367" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">z = 3,0</text><circle cx="350" cy="777" r="17" fill="#fff" stroke="#9aa6a0" stroke-width="3"/><text x="350" y="782" font-size="14" font-weight="800" fill="#16324f" text-anchor="middle">F</text><text x="350" y="817" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">z = 2,2</text><circle cx="690" cy="777" r="17" fill="#fff" stroke="#9aa6a0" stroke-width="3"/><text x="690" y="782" font-size="14" font-weight="800" fill="#16324f" text-anchor="middle">G</text><text x="690" y="817" font-size="14" font-weight="500" fill="#5f7389" text-anchor="middle">z = 2,3</text><circle cx="90" cy="237" r="11" fill="#2979f2"/><text x="110" y="243" font-size="16" font-weight="500" fill="#16324f" text-anchor="start">Sumber: titik sungai–kanal (buffer 30 m), atau ditambah manual</text><circle cx="90" cy="269" r="11" fill="#f26522"/><text x="110" y="275" font-size="16" font-weight="500" fill="#16324f" text-anchor="start">Target: node TERTINGGI tiap klaster terpilih (bisa diganti manual)</text><line x1="78" y1="301" x2="102" y2="301" stroke="#08a67a" stroke-width="7"/><text x="110" y="307" font-size="16" font-weight="500" fill="#16324f" text-anchor="start">Pohon Steiner: ruas bersama dipakai ulang oleh beberapa target</text><line x1="78" y1="333" x2="102" y2="333" stroke="#9aa6a0" stroke-width="3"/><text x="110" y="339" font-size="16" font-weight="500" fill="#16324f" text-anchor="start">Jalur alternatif lebih mahal / terblokir</text><rect x="66" y="843" width="968" height="130" rx="16" fill="#ffffff" stroke="#2979f2" stroke-width="2"/><rect x="78" y="833" width="380" height="28" rx="14" fill="url(#gChip)"/><text x="92" y="853" font-size="15" font-weight="800" fill="#fff" text-anchor="start">Heuristik jalur terpendek (Takahashi–Matsuyama)</text><text x="82" y="889" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">1. Tambahkan super-source ke semua sumber (biaya 0)</text><text x="82" y="914" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">2. Dijkstra dari pohon saat ini ke semua node</text><text x="82" y="939" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">3. Sambung target terdekat yang belum terhubung</text><text x="82" y="964" font-size="16.5" font-weight="500" fill="#16324f" text-anchor="start">4. Ulangi sampai semua target terhubung atau tak terjangkau</text><text x="1020" y="931" font-size="15" font-weight="800" fill="#d9363e" text-anchor="end">Target tak terjangkau → qa_unreachable_targets</text><text x="1020" y="953" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">alasan: sekat tanpa pintu / terputus dari sungai / tanpa jalur</text><rect x="1090" y="125" width="780" height="865" rx="22" fill="#f3f6fb" stroke="#dce5f1" stroke-width="2"/><path d="M1090 171V147a22 22 0 0 1 22 -22H1848a22 22 0 0 1 22 22V171Z" fill="url(#gBlue)"/><text x="1112" y="156.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">B. Kebutuhan air, tinggi tekan, dan stasiun pompa</text><rect x="1108" y="187" width="134" height="70" rx="16" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/><text x="1175.0" y="219" font-size="15" font-weight="800" fill="#12406b" text-anchor="middle">Defisit</text><text x="1175.0" y="241" font-size="12.5" font-weight="500" fill="#5f7389" text-anchor="middle">(mm, tabel prioritas)</text><polygon points="1244.0,209.0 1249.0,209.0 1254.0,222.0 1249.0,235.0 1244.0,235.0 1249.0,222.0" fill="#f7941d"/><rect x="1256" y="187" width="134" height="70" rx="16" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/><text x="1323.0" y="219" font-size="15" font-weight="800" fill="#12406b" text-anchor="middle">× luas gambut</text><text x="1323.0" y="241" font-size="12.5" font-weight="500" fill="#5f7389" text-anchor="middle">dalam jarak pengaruh</text><polygon points="1392.0,209.0 1397.0,209.0 1402.0,222.0 1397.0,235.0 1392.0,235.0 1397.0,222.0" fill="#f7941d"/><rect x="1404" y="187" width="134" height="70" rx="16" fill="url(#gChip)"/><text x="1471.0" y="219" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">= V</text><text x="1471.0" y="241" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle" fill-opacity="0.92">(m³)</text><polygon points="1540.0,209.0 1545.0,209.0 1550.0,222.0 1545.0,235.0 1540.0,235.0 1545.0,222.0" fill="#f7941d"/><rect x="1552" y="187" width="134" height="70" rx="16" fill="#ffffff" stroke="#dce5f1" stroke-width="2"/><text x="1619.0" y="219" font-size="15" font-weight="800" fill="#12406b" text-anchor="middle">÷ detik periode</text><text x="1619.0" y="241" font-size="12.5" font-weight="500" fill="#5f7389" text-anchor="middle">(hari × 86400)</text><polygon points="1688.0,209.0 1693.0,209.0 1698.0,222.0 1693.0,235.0 1688.0,235.0 1693.0,222.0" fill="#f7941d"/><rect x="1700" y="187" width="134" height="70" rx="16" fill="url(#gChip)"/><text x="1767.0" y="219" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">= Q</text><text x="1767.0" y="241" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle" fill-opacity="0.92">(m³/s)</text><text x="1110" y="281" font-size="14.5" font-weight="500" fill="#5f7389" text-anchor="start">Per sub-KHG: luas = gambut ∩ buffer segmen terlayani ∩ sub-KHG; Q dijumlah antar sub-KHG.</text><text x="1110" y="309" font-size="14.5" font-weight="500" fill="#5f7389" text-anchor="start">Stasiun dipasang di sumber, lalu setiap kali head kumulatif akan melebihi H maks (digeser ke sekat terdekat).</text><line x1="1180" y1="621" x2="1840" y2="621" stroke="#5f7389" stroke-width="2" marker-end="url(#m5f7389)"/><line x1="1166" y1="613" x2="1166" y2="357" stroke="#5f7389" stroke-width="2" marker-end="url(#m5f7389)"/><text x="1840" y="647" font-size="14" font-weight="500" fill="#5f7389" text-anchor="end">jarak sepanjang rute dari sumber</text><text x="1160" y="349" font-size="14" font-weight="500" fill="#5f7389" text-anchor="start">muka air (m)</text><polyline points="1180.0,605.0 1253.2,581.0 1363.0,533.0 1485.0,477.0 1607.0,437.0 1698.5,397.0 1790.0,357.0" fill="none" stroke="#12406b" stroke-width="3.5" stroke-linejoin="round"/><text x="1198.3" y="389.0" font-size="14.5" font-weight="800" fill="#12406b" text-anchor="start">muka kolam yang diperlukan = z_lahan − dA</text><line x1="1180" y1="605.0" x2="1790.0" y2="605.0" stroke="#2979f2" stroke-width="2" stroke-dasharray="7 4"/><text x="1558.2" y="597.0" font-size="14.5" font-weight="800" fill="#2979f2" text-anchor="start">z_sumber (muka air sungai)</text><line x1="1180.0" y1="605.0" x2="1436.2" y2="605.0" stroke="#f26522" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="1430.2" y1="605.0" x2="1430.2" y2="512.2" stroke="#f26522" stroke-width="2.5" marker-end="url(#mf26522)"/><text x="1420.2" y="563.6" font-size="15" font-weight="800" fill="#f26522" text-anchor="end">H1</text><line x1="1436.2" y1="512.2" x2="1668.0" y2="512.2" stroke="#f26522" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="1662.0" y1="512.2" x2="1662.0" y2="416.2" stroke="#f26522" stroke-width="2.5" marker-end="url(#mf26522)"/><text x="1652.0" y="469.20000000000005" font-size="15" font-weight="800" fill="#f26522" text-anchor="end">H2</text><rect x="1168.0" y="593.0" width="24" height="24" rx="5" fill="#12406b" stroke="#fff" stroke-width="2"/><text x="1180.0" y="610.0" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">P</text><text x="1176.0" y="645.0" font-size="14" font-weight="800" fill="#12406b" text-anchor="start">PS1 (di sumber)</text><rect x="1424.2" y="500.20000000000005" width="24" height="24" rx="5" fill="#12406b" stroke="#fff" stroke-width="2"/><text x="1436.2" y="517.2" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">P</text><text x="1458.2" y="546.2" font-size="14" font-weight="800" fill="#12406b" text-anchor="start">PS2 (di sekat terdekat)</text><circle cx="1790.0" cy="357.0" r="18" fill="#f26522" stroke="#fff" stroke-width="3"/><text x="1790.0" y="363.0" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">T</text><text x="1778.0" y="329.0" font-size="15" font-weight="800" fill="#f26522" text-anchor="end">target</text><rect x="1108" y="673" width="744" height="54" rx="16" fill="url(#gChip)"/><text x="1124" y="696" font-size="15.5" font-weight="800" fill="#fff" text-anchor="start">H total</text><text x="1290" y="696" font-size="16" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">H = H_statik + Σ h_f</text><text x="1290" y="716" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">H_statik = muka kolam target − z_sumber</text><rect x="1108" y="735" width="744" height="54" rx="16" fill="url(#gChip)"/><text x="1124" y="758" font-size="15.5" font-weight="800" fill="#fff" text-anchor="start">Gesekan (kanal)</text><text x="1290" y="758" font-size="16" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">h_f = L·(n·Q / (A·R^(2/3)))²</text><text x="1290" y="778" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">Manning, penampang persegi dari lebar, kedalaman</text><rect x="1108" y="797" width="744" height="54" rx="16" fill="url(#gChip)"/><text x="1124" y="820" font-size="15.5" font-weight="800" fill="#fff" text-anchor="start">Gesekan (pipa)</text><text x="1290" y="820" font-size="16" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">h_f = 10,67·L·Q^1,852 / (C^1,852·D^4,87)</text><text x="1290" y="840" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">Hazen–Williams</text><rect x="1108" y="859" width="744" height="54" rx="16" fill="url(#gChip)"/><text x="1124" y="882" font-size="15.5" font-weight="800" fill="#fff" text-anchor="start">Daya</text><text x="1290" y="882" font-size="16" font-weight="700" fill="#fff" text-anchor="start" font-family="Consolas, Menlo, monospace">P = ρ·g·Q·H / η</text><text x="1290" y="902" font-size="13.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.92">ρ = 1000 kg/m³, g = 9,81 m/s²</text><rect x="1108" y="929" width="744" height="50" rx="16" fill="url(#gOrange)"/><text x="1124" y="951" font-size="15.5" font-weight="800" fill="#fff" text-anchor="start">Keluaran: pump_stations (Q, H, kW, jumlah unit), gates_required,</text><text x="1124" y="971" font-size="14.5" font-weight="500" fill="#fff" text-anchor="start" fill-opacity="0.95">demand per rute di pump_routes. Kekurangan kapasitas dilaporkan, tidak dipotong.</text><rect x="50" y="1010" width="1820" height="50" rx="25" fill="url(#gBlue)"/><text x="960" y="1042" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Target yang tidak terjangkau dilaporkan beserta alasannya; kekurangan kapasitas pompa dilaporkan, tidak dipotong diam-diam.</text><text x="1870" y="1076" font-size="14" font-weight="400" fill="#5f7389" text-anchor="end">RE-PEAT  ·  KLH  ·  Departemen Teknik Geodesi UGM</text></svg>