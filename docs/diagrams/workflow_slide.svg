<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Calibri, Arial, sans-serif" role="img" aria-label="Workflow: data, prepare, decide, route and pump, results"><defs><marker id="a1d6b4f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d6b4f"/></marker><marker id="ab36b00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b36b00"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#ffffff"/><text x="60" y="95" font-size="60" font-weight="700" fill="#1f2a24" text-anchor="start">From data to pump plan</text><text x="60" y="142" font-size="28" font-weight="400" fill="#5b6862" text-anchor="start">How RE-PEAT Pompanisasi turns canal, peat and elevation data into sekat and pump locations</text><text x="60" y="193" font-size="22" font-weight="700" fill="#5b6862" text-anchor="start">YOUR DATA</text><rect x="60" y="205" width="290" height="84" rx="14" fill="#f6f8f6" stroke="#cfd8d2" stroke-width="2"/><text x="80" y="255.0" font-size="23" font-weight="600" fill="#1f2a24" text-anchor="start">Elevation (DTM)</text><rect x="60" y="305" width="290" height="84" rx="14" fill="#f6f8f6" stroke="#cfd8d2" stroke-width="2"/><text x="80" y="355.0" font-size="23" font-weight="600" fill="#1f2a24" text-anchor="start">Canals + manual fixes</text><rect x="60" y="405" width="290" height="84" rx="14" fill="#f6f8f6" stroke="#cfd8d2" stroke-width="2"/><text x="80" y="455.0" font-size="23" font-weight="600" fill="#1f2a24" text-anchor="start">Peat depth, burn scars</text><rect x="60" y="505" width="290" height="84" rx="14" fill="#f6f8f6" stroke="#cfd8d2" stroke-width="2"/><text x="80" y="555.0" font-size="23" font-weight="600" fill="#1f2a24" text-anchor="start">Moisture index</text><rect x="60" y="605" width="290" height="84" rx="14" fill="#f6f8f6" stroke="#cfd8d2" stroke-width="2"/><text x="80" y="655.0" font-size="23" font-weight="600" fill="#1f2a24" text-anchor="start">Sub-KHGs + priority</text><rect x="60" y="705" width="290" height="84" rx="14" fill="#f6f8f6" stroke="#cfd8d2" stroke-width="2"/><text x="80" y="755.0" font-size="23" font-weight="600" fill="#1f2a24" text-anchor="start">Rivers, existing sekat</text><rect x="386" y="205" width="345" height="585" rx="14" fill="#ffffff" stroke="#1d6b4f" stroke-width="3"/><path d="M386 219a14 14 0 0 1 14 -14h317a14 14 0 0 1 14 14v96h-345z" fill="#1d6b4f"/><text x="410" y="255" font-size="31" font-weight="700" fill="#ffffff" text-anchor="start">PREPARE</text><text x="410" y="293" font-size="22" font-weight="400" fill="#d6efe3" text-anchor="start">Stages 1-5</text><circle cx="693" cy="243" r="22" fill="#a33a3a"/><text x="693" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="416" cy="366" r="5" fill="#1d6b4f"/><text x="432" y="373" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Check and clip the data</text><circle cx="416" cy="418" r="5" fill="#1d6b4f"/><text x="432" y="425" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Clean and connect canals</text><circle cx="416" cy="470" r="5" fill="#1d6b4f"/><text x="432" y="477" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Work out water flow</text><circle cx="416" cy="522" r="5" fill="#1d6b4f"/><text x="432" y="529" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Cut canals into segments</text><circle cx="416" cy="574" r="5" fill="#1d6b4f"/><text x="432" y="581" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Measure the land slope</text><line x1="410" y1="678" x2="707" y2="678" stroke="#cfd8d2" stroke-width="2"/><text x="410" y="718" font-size="22" font-weight="600" fill="#14513b" text-anchor="start" font-style="italic">Is the network connected</text><text x="410" y="749" font-size="22" font-weight="600" fill="#14513b" text-anchor="start" font-style="italic">and the terrain known?</text><rect x="765" y="205" width="345" height="585" rx="14" fill="#ffffff" stroke="#1d6b4f" stroke-width="3"/><path d="M765 219a14 14 0 0 1 14 -14h317a14 14 0 0 1 14 14v96h-345z" fill="#1d6b4f"/><text x="789" y="255" font-size="31" font-weight="700" fill="#ffffff" text-anchor="start">DECIDE</text><text x="789" y="293" font-size="22" font-weight="400" fill="#d6efe3" text-anchor="start">Stages 6-7</text><circle cx="1072" cy="243" r="22" fill="#a33a3a"/><text x="1072" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><circle cx="795" cy="366" r="5" fill="#1d6b4f"/><text x="811" y="373" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Score each segment</text><text x="811" y="425" font-size="21" font-weight="400" fill="#5b6862" text-anchor="start">(burn, peat, dryness, flow)</text><circle cx="795" cy="470" r="5" fill="#1d6b4f"/><text x="811" y="477" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Rank and pick top canals</text><circle cx="795" cy="522" r="5" fill="#1d6b4f"/><text x="811" y="529" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Count sekat needed</text><circle cx="795" cy="574" r="5" fill="#1d6b4f"/><text x="811" y="581" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Place sekat per 0.4 m rise</text><line x1="789" y1="678" x2="1086" y2="678" stroke="#cfd8d2" stroke-width="2"/><text x="789" y="718" font-size="22" font-weight="600" fill="#14513b" text-anchor="start" font-style="italic">Which canals need water,</text><text x="789" y="749" font-size="22" font-weight="600" fill="#14513b" text-anchor="start" font-style="italic">and where do blocks go?</text><rect x="1144" y="205" width="345" height="585" rx="14" fill="#ffffff" stroke="#1d6b4f" stroke-width="3"/><path d="M1144 219a14 14 0 0 1 14 -14h317a14 14 0 0 1 14 14v96h-345z" fill="#1d6b4f"/><text x="1168" y="255" font-size="31" font-weight="700" fill="#ffffff" text-anchor="start">ROUTE + PUMP</text><text x="1168" y="293" font-size="22" font-weight="400" fill="#d6efe3" text-anchor="start">Stages 8-10</text><circle cx="1451" cy="243" r="22" fill="#a33a3a"/><text x="1451" y="252" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><circle cx="1174" cy="366" r="5" fill="#1d6b4f"/><text x="1190" y="373" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Find river water sources</text><circle cx="1174" cy="418" r="5" fill="#1d6b4f"/><text x="1190" y="425" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Route to the highest point</text><text x="1190" y="477" font-size="21" font-weight="400" fill="#5b6862" text-anchor="start">(least uphill pumping)</text><circle cx="1174" cy="522" r="5" fill="#1d6b4f"/><text x="1190" y="529" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Size pumps, place stations</text><circle cx="1174" cy="574" r="5" fill="#1d6b4f"/><text x="1190" y="581" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">List gates to add</text><line x1="1168" y1="678" x2="1465" y2="678" stroke="#cfd8d2" stroke-width="2"/><text x="1168" y="718" font-size="22" font-weight="600" fill="#14513b" text-anchor="start" font-style="italic">How does water get there,</text><text x="1168" y="749" font-size="22" font-weight="600" fill="#14513b" text-anchor="start" font-style="italic">and what pumps are needed?</text><rect x="1523" y="205" width="337" height="585" rx="14" fill="#e3f1ea" stroke="#1d6b4f" stroke-width="3"/><text x="1547" y="255" font-size="31" font-weight="700" fill="#14513b" text-anchor="start">RESULTS</text><text x="1547" y="293" font-size="22" font-weight="400" fill="#5b6862" text-anchor="start">one GeoPackage + report</text><circle cx="1553" cy="366" r="5" fill="#1d6b4f"/><text x="1569" y="373" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Canal priority map</text><circle cx="1553" cy="421" r="5" fill="#1d6b4f"/><text x="1569" y="428" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Sekat: place, height, type</text><circle cx="1553" cy="476" r="5" fill="#1d6b4f"/><text x="1569" y="483" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Water sources and routes</text><circle cx="1553" cy="531" r="5" fill="#1d6b4f"/><text x="1569" y="538" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Pump stations + power</text><circle cx="1553" cy="586" r="5" fill="#1d6b4f"/><text x="1569" y="593" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Gates to add</text><circle cx="1553" cy="641" r="5" fill="#1d6b4f"/><text x="1569" y="648" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Layers to double-check</text><circle cx="1553" cy="696" r="5" fill="#1d6b4f"/><text x="1569" y="703" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Run report</text><circle cx="1553" cy="751" r="5" fill="#1d6b4f"/><text x="1569" y="758" font-size="22.5" font-weight="400" fill="#1f2a24" text-anchor="start">Optional: Stage 12</text><line x1="352" y1="497.5" x2="384" y2="497.5" stroke="#1d6b4f" stroke-width="5" marker-end="url(#a1d6b4f)"/><line x1="733" y1="497.5" x2="763" y2="497.5" stroke="#1d6b4f" stroke-width="5" marker-end="url(#a1d6b4f)"/><line x1="1112" y1="497.5" x2="1142" y2="497.5" stroke="#1d6b4f" stroke-width="5" marker-end="url(#a1d6b4f)"/><line x1="1491" y1="497.5" x2="1521" y2="497.5" stroke="#1d6b4f" stroke-width="5" marker-end="url(#a1d6b4f)"/><rect x="386" y="840" width="1103" height="150" rx="14" fill="#fff3dc" stroke="#b36b00" stroke-width="3" stroke-dasharray="10 8"/><text x="416" y="890" font-size="26" font-weight="700" fill="#b36b00" text-anchor="start">YOUR DECISIONS  (config file)</text><text x="416" y="932" font-size="26" font-weight="400" fill="#1f2a24" text-anchor="start">weights  ·  snap tolerance  ·  sekat spacing  ·  pump settings</text><text x="416" y="970" font-size="22" font-weight="400" fill="#5b6862" text-anchor="start">Nothing is guessed: if a decision is missing, the run stops and lists it.</text><line x1="558.5" y1="838" x2="558.5" y2="796" stroke="#b36b00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ab36b00)"/><line x1="937.5" y1="838" x2="937.5" y2="796" stroke="#b36b00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ab36b00)"/><line x1="1316.5" y1="838" x2="1316.5" y2="796" stroke="#b36b00" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ab36b00)"/><circle cx="1547" cy="876" r="20" fill="#a33a3a"/><text x="1547" y="885" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">!</text><text x="1581" y="885" font-size="27" font-weight="700" fill="#a33a3a" text-anchor="start">Review stop</text><text x="1523" y="930" font-size="22" font-weight="400" fill="#1f2a24" text-anchor="start">The run pauses so you can check</text><text x="1523" y="960" font-size="22" font-weight="400" fill="#1f2a24" text-anchor="start">the result, then approve it.</text><text x="60" y="1050" font-size="20" font-weight="400" fill="#5b6862" text-anchor="start">RE-PEAT  ·  KLH  ·  Departemen Teknik Geodesi UGM</text></svg>